<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Single Page Site</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background: #333; padding: 1rem; text-align: center; position: fixed; width: 100%; top: 0; }
        nav a { color: white; margin: 0 15px; text-decoration: none; cursor: pointer; }
        section { padding: 100px 20px 40px; min-height: 100vh; box-sizing: border-box; }
        #home { background: #f4f4f4; }
        #about { background: #e2e2e2; }
        #dynamic-content { background: #d4d4d4; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

    <nav>
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('about')">About</a>
        <a onclick="loadDynamicData()">Load Dynamic Items</a>
    </nav>

    <section id="home">
        <h1>Welcome Home</h1>
        <p id="paragraph_s1">This is the main landing view.</p>
    </section>

    <section id="about" style="display:none;">
        <h1>About Us</h1>
        <p>We build fast, single-page web applications.</p>
    </section>

    <section id="dynamic-content" style="display:none;">
        <h1>Dynamic Content Section</h1>
        <div id="card-container">Click the nav link to load data via JavaScript.</div>
    </section>

    <div id: "editor" contenteditable="true"></div>

    <script>
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(sec => sec.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function loadDynamicData() {
            showSection('dynamic-content');
            const container = document.getElementById('card-container');
            container.innerHTML = '<p>Loading...</p>';
            
            // Simulating an API fetch for dynamic content generation
            setTimeout(() => {
                const items = ['Dynamic Project Alpha', 'Dynamic Project Beta', 'Live Feed Item'];
                container.innerHTML = items.map(item => `<div class="card"><h3>${item}</h3><p>Generated on ${new Date().toLocaleTimeString()}</p></div>`).join('');
            }, 500);
        }
        
        // MESSAGE PASSING
        window.addEventListener("message", function (event) {
          console.log(FETCHING DATA)
          var storedText;

          fetch("https://raw.githubusercontent.com/Lonnewolf46/lonnewolf46.github.io/refs/heads/main/data.txt")
            .then(function(response) {
              response.text().then(function(text) {
                storedText = text;
                done();
              });
            });
          
          console.log("EVENT ORIGIN DETECTED ON ", event.origin)
          if (event.origin !== "https://portalcc.medismart.net") {
              console.log("Ignore messages from unknown origins. Content wont be decoded")
              document.getElementById("paragraph_s1").textContent = "Nothing to show here"
            return; // Ignore messages from unknown origins
          }
        
          const { action, data } = event.data;
          if (action === "init") {
              console.log("Received from parent:", data);
              document.getElementById("paragraph_s1").textContent = storedText
          }});
    </script>
</body>
</html>

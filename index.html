<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Single Page Site</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        nav { background: #333; padding: 1rem; text-align: center; position: fixed; width: 100%; top: 0; }
        nav a { color: white; margin: 0 15px; text-decoration: none; cursor: pointer; }
        section { padding: 100px 20px 40px; min-height: 100vh; box-sizing: border-box; }
        #home { background: #f4f4f4; }
        #about { background: #e2e2e2; }
        #dynamic-content { background: #d4d4d4; }
        .card { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
</head>
<body>

    <nav>
        <a onclick="showSection('home')">Home</a>
        <a onclick="showSection('about')">About</a>
        <a onclick="loadDynamicData()">Load Dynamic Items</a>
    </nav>

    <section id="home">
        <h1>Welcome Home</h1>
        <p id="paragraph_s1">This is the main landing view.</p>
    </section>

    <section id="about" style="display:none;">
        <h1>About Us</h1>
        <p>We build fast, single-page web applications.</p>
    </section>

    <section id="dynamic-content" style="display:none;">
        <h1>Dynamic Content Section</h1>
        <div id="card-container">Click the nav link to load data via JavaScript.</div>
    </section>

    <div id: "editor" contenteditable="true"></div>

    <script>
        const IV_LENGTH = 12;
        
        function showSection(sectionId) {
            document.querySelectorAll('section').forEach(sec => sec.style.display = 'none');
            document.getElementById(sectionId).style.display = 'block';
        }

        function loadDynamicData() {
            showSection('dynamic-content');
            const container = document.getElementById('card-container');
            container.innerHTML = '<p>Loading...</p>';
            
            // Simulating an API fetch for dynamic content generation
            setTimeout(() => {
                const items = ['Dynamic Project Alpha', 'Dynamic Project Beta', 'Live Feed Item'];
                container.innerHTML = items.map(item => `<div class="card"><h3>${item}</h3><p>Generated on ${new Date().toLocaleTimeString()}</p></div>`).join('');
            }, 500);
        }
        
        function base64ToBytes(base64) {
            const binary =
                atob(base64);
            const bytes =
                new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++) {
                bytes[i] =
                    binary.charCodeAt(i);
            }

            return bytes;
    }

        async function getAESKey(keyString){
            let keyBytes;
            try {
                keyBytes =
                    base64ToBytes(keyString);
            } catch {
                throw new Error(
                    "The encryption key is not valid Base64."
                );
            }

            if (keyBytes.length !== 32) {
                throw new Error(
                    "The encryption key must be 32 bytes (256 bits)."
                );
            }


            return await crypto.subtle.importKey(
                "raw",
                keyBytes,
                {
                    name: "AES-GCM"
                },
                false,
                [
                    "encrypt",
                    "decrypt"
                ]
            );
        }

        async function decryptData(text, key) {
            try {
                const encryptedText = text

                if (!encryptedText) {
                    throw new Error(
                        "No ciphertext to decrypt."
                    );
                }

                let encryptedBytes;
                try {
                    encryptedBytes =
                        base64ToBytes(encryptedText);
                } catch {
                    throw new Error(
                        "The ciphertext is not valid Base64."
                    );
                }

                /*
                Check minimum size.
                */
                if (
                    encryptedBytes.length <= IV_LENGTH
                ) {

                    throw new Error(
                        "The ciphertext is too short."
                    );
                }

                /*
                Extract IV.
                */
                const iv =
                    encryptedBytes.slice(
                        0,
                        IV_LENGTH
                    );

                /*
                Extract ciphertext.
                */
                const ciphertext =
                    encryptedBytes.slice(
                        IV_LENGTH
                    );

                /*
                Get AES key.
                */
                const aesKey = await getAESKey(key);

                /*
                Decrypt.
                */
                const decrypted =
                    await crypto.subtle.decrypt(
                        {
                            name: "AES-GCM",
                            iv: iv,
                            tagLength: 128
                        },
                        aesKey,
                        ciphertext
                    );

                /*
                Convert to text.
                */
                const jsonText =
                    new TextDecoder()
                        .decode(decrypted);
                
                /*
                Parse JSON.
                */
                const jsonObject =
                    JSON.parse(jsonText);
                
                return jsonObject
                
            } catch (error) {
                console.error(error);
                return "Decryption failed. The key may be incorrect, or the ciphertext may have been modified or corrupted."
            }
        }
        
        // MESSAGE PASSING
       window.addEventListener("message", function (event) {
          console.log("EVENT ORIGIN DETECTED ON", event.origin);
      
          if (
              event.origin !== "https://portalcc.medismart.net" ||
              !event.data ||
              typeof event.data !== "object"
          ) {
              console.log(
                  "Ignore messages from unknown origins. Content won't be decoded"
              );
      
              document.getElementById("paragraph_s1").textContent =
                  "Nothing to show here";
      
              return;
          }
      
          const { action, data: key } = event.data;
      
          if (action === "init") {
            console.log("Key received from parent:", key);
        
            fetch(
                "https://raw.githubusercontent.com/Lonnewolf46/lonnewolf46.github.io/refs/heads/main/data.txt",
                { cache: "no-store" }
            )
            .then(async response => {
                console.log("FETCH STATUS:", response.status);
                console.log("FETCH OK:", response.ok);
        
                const text = await response.text();
        
                console.log("FETCHED TEXT LENGTH:", text.length);
                console.log("FETCHED TEXT:", text);
        
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
        
                return text;
            })
            .then(async storedText => {
                console.log("Starting decryption...");
        
                const decryptedData = await decryptData(storedText, key);
        
                console.log("DECRYPTED DATA:", decryptedData);
                console.log("DECRYPTED TYPE:", typeof decryptedData);
        
                document.getElementById("paragraph_s1").textContent =
                    typeof decryptedData === "string"
                        ? decryptedData
                        : JSON.stringify(decryptedData, null, 2);
            })
            .catch(error => {
                console.error("FETCH/DECRYPT ERROR:", error);
        
                document.getElementById("paragraph_s1").textContent =
                    "Nothing to show here";
            });
        }
       });
    </script>
</body>
</html>
